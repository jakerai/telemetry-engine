syntax = "proto3";

package com.telemetry.engine.ingestion.protocol.grpc;

option java_package = "com.telemetry.engine.ingestion.protocol.grpc";
option java_multiple_files = true;

import "service_request_grpc.proto";
import "service_response_grpc.proto";


service IngestionService {
  rpc ingestGrpc(ServiceRequestGrpc) returns (ServiceResponseGrpc);
}
