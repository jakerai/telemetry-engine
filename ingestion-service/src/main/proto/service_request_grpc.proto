syntax = "proto3";

package com.telemetry.engine.ingestion.protocol.grpc;

option java_package = "com.telemetry.engine.ingestion.protocol.grpc";
option java_multiple_files = true;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";


message ServiceRequestGrpc {
  MessageEventListGrpc payload = 1;
}


message MessageEventListGrpc {
  repeated MessageEventRequestGrpc events = 1;
}

message MessageEventRequestGrpc {
  string requestId = 1;
  int64 assetId = 2;
  int64 assetTypeId = 3;
  double latitude = 4;
  double longitude = 5;
  double speed = 6;
  double heading = 7;
  int64 operatorId = 8;
  google.protobuf.Timestamp deviceTs = 9;
  google.protobuf.Timestamp processedAt = 10;
}