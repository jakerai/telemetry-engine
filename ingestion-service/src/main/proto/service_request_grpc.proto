syntax = "proto3";

package com.telemetry.engine.ingestion.protocol.grpc;

option java_package = "com.telemetry.engine.ingestion.protocol.grpc";
option java_multiple_files = true;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";


message ServiceRequestGrpc {
  MessageEventListGrpc payload = 1;
}


message MessageEventListGrpc {
  repeated MessageEventRequestGrpc events = 1;
}

message MessageEventRequestGrpc {
  string requestId = 1;
  int64 assetId = 2;
  double latitude = 3;
  double longitude = 4;
  double speed = 5;
  double heading = 6;
  google.protobuf.Timestamp deviceTs = 7;
  google.protobuf.Timestamp processedAt = 8;
}