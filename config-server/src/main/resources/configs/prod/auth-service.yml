server:
  port: 5000

spring:
  application:
    name: auth-service
    
  jackson:
    default-property-inclusion: non_null
    
  config:
    import: classpath:roles.yaml
    
  cloud:
    config:
      enabled: false
  
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH2_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH2_CLIENT_SECRET}
            scope:
              - email
              - profile  
  
    
  datasource:
    url: jdbc:postgresql://localhost:5432/telemetry?currentSchema=auth
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  mvc:
    log-request-details: true

app:
  security:
    jwt:
      issuer: auth-service
      access-expiry: 3600 # in seconds
      refresh-expiry: 604800 # in seconds
      key-source: db # db for database, aws-secrets for AWS secret manager
      rotation:
        check-interval-ms: 60000 # in milliseconds
        validity-seconds: 3000 # in seconds
        rotate-before-seconds: 30 # in seconds
      rsa:
        key-size: 2048
      encryption:
        master-secret: ${JWT_MASTER_SECRET}
    oauth2:
      allowed-redirect-uris:
        - http://localhost:3000/dashboard.html
        - my-android-app-schema-dev://mobile/dashboard
        - my-ios-app-schema-dev://mobile/dashboard
      

aws:
  region: us-east-2
  ses:
    verified-sender-email: ${AWS_SES_SENDER_EMAIL}
    
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway,refresh
  tracing:
    sampling:
      probability: 0.2
  otlp:
    tracing:
      enabled: false
       #OTLP collector endpoint (gRPC)
      #endpoint: http://localhost:4317
    otlp:
    metrics:
      export:
        enabled: false
      

logging:
  file:
    name: logs/app.log
    max-size: 10MB
    max-history: 30
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [${spring.application.name:}, traceId=%X{traceId:-}, spanId=%X{spanId:-}] [%logger{0}.%M:%L] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.telemetry.engine: INFO 
    org.springframework.security: DEBUG
    org.hibernate.SQL: INFO