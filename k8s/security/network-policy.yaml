apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal
  namespace: telemetry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}  # allow all pods in same namespace
  egress:
    - to:
        - podSelector: {}  # allow all pods in same namespace
